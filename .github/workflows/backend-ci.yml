name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Test, build and audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oziraf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oziraf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oziraf_ci
      JWT_SECRET: ci_oziraf_secret
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: docker build -t oziraf-backend:ci .
