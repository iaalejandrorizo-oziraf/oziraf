name: OZIRAF PC Runner

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      task:
        description: Task to run on the OZIRAF Windows PC
        required: true
        default: mobile-analyze
        type: choice
        options:
          - backend-test
          - backend-build
          - mobile-analyze
          - mobile-test
          - mobile-build-apk
          - mobile-build-web
          - all-checks

jobs:
  run:
    name: Run ${{ github.event_name == 'push' && 'mobile-auto-deploy' || inputs.task }}
    runs-on: [self-hosted, Windows, X64, oziraf]

    defaults:
      run:
        shell: powershell

    env:
      TASK: ${{ github.event_name == 'push' && 'mobile-auto-deploy' || inputs.task }}
      FLUTTER_HOME: D:\OZIRAF\tools\flutter-zip\flutter
      ANDROID_HOME: C:\Users\aleja\AppData\Local\Android\Sdk
      GRADLE_USER_HOME: D:\OZIRAF\tools\gradle-cache
      TEMP: D:\OZIRAF\tools\tmp
      TMP: D:\OZIRAF\tools\tmp
      OZIRAF_REMOTE_API_URL: http://100.112.136.50:3001
      OZIRAF_WEB_PUBLISH_PATH: D:\OZIRAF\mobile\build\web
      OZIRAF_DEBUG_APK_PUBLISH_PATH: D:\OZIRAF\mobile\build\web\downloads\oziraf-debug.apk
      OZIRAF_RELEASE_APK_PUBLISH_PATH: D:\OZIRAF\mobile\build\web\downloads\oziraf-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local tool paths
        run: |
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME, $env:TEMP | Out-Null
          "$env:FLUTTER_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ANDROID_HOME\cmdline-tools\latest\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ANDROID_HOME\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ANDROID_HOME\emulator" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Backend install
        if: env.TASK == 'backend-test' || env.TASK == 'backend-build' || env.TASK == 'all-checks'
        run: npm ci

      - name: Backend test
        if: env.TASK == 'backend-test' || env.TASK == 'all-checks'
        run: npm run test -- --runInBand

      - name: Backend build
        if: env.TASK == 'backend-build' || env.TASK == 'all-checks'
        run: npm run build

      - name: Flutter doctor
        if: startsWith(env.TASK, 'mobile-') || env.TASK == 'all-checks'
        working-directory: mobile
        run: flutter doctor -v

      - name: Flutter pub get
        if: startsWith(env.TASK, 'mobile-') || env.TASK == 'all-checks'
        working-directory: mobile
        run: flutter pub get

      - name: Mobile analyze
        if: env.TASK == 'mobile-analyze' || env.TASK == 'mobile-auto-deploy' || env.TASK == 'all-checks'
        working-directory: mobile
        run: flutter analyze

      - name: Mobile test
        if: env.TASK == 'mobile-test' || env.TASK == 'all-checks'
        working-directory: mobile
        run: flutter test

      - name: Mobile build debug APK
        if: env.TASK == 'mobile-build-apk' || env.TASK == 'mobile-auto-deploy'
        working-directory: mobile
        run: |
          flutter build apk --debug `
            "--dart-define=OZIRAF_API_URL=$env:OZIRAF_REMOTE_API_URL" `
            "--dart-define=OZIRAF_ANDROID_API_URL=$env:OZIRAF_REMOTE_API_URL"

      - name: Mobile build release APK
        if: env.TASK == 'mobile-build-apk' || env.TASK == 'mobile-auto-deploy'
        working-directory: mobile
        run: |
          flutter build apk --release `
            "--dart-define=OZIRAF_API_URL=$env:OZIRAF_REMOTE_API_URL" `
            "--dart-define=OZIRAF_ANDROID_API_URL=$env:OZIRAF_REMOTE_API_URL"

      - name: Mobile build web
        if: env.TASK == 'mobile-build-web' || env.TASK == 'mobile-auto-deploy'
        working-directory: mobile
        run: |
          flutter build web --debug `
            "--dart-define=OZIRAF_API_URL=$env:OZIRAF_REMOTE_API_URL"

      - name: Publish web to OZIRAF local server
        if: env.TASK == 'mobile-build-web' || env.TASK == 'mobile-auto-deploy'
        working-directory: mobile
        run: |
          $source = Join-Path $PWD 'build\web'
          $destination = $env:OZIRAF_WEB_PUBLISH_PATH
          if (-not (Test-Path $source)) {
            throw "Web build not found at $source"
          }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem -Path $source | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $destination -Recurse -Force
          }
          Write-Host "Published web build to $destination"

      - name: Publish APKs to OZIRAF local server
        if: env.TASK == 'mobile-build-apk' || env.TASK == 'mobile-auto-deploy'
        working-directory: mobile
        run: |
          $debugSource = Join-Path $PWD 'build\app\outputs\flutter-apk\app-debug.apk'
          $releaseSource = Join-Path $PWD 'build\app\outputs\flutter-apk\app-release.apk'
          $debugDestination = $env:OZIRAF_DEBUG_APK_PUBLISH_PATH
          $releaseDestination = $env:OZIRAF_RELEASE_APK_PUBLISH_PATH

          if (-not (Test-Path $debugSource)) {
            throw "Debug APK not found at $debugSource"
          }
          if (-not (Test-Path $releaseSource)) {
            throw "Release APK not found at $releaseSource"
          }

          New-Item -ItemType Directory -Force -Path (Split-Path $debugDestination -Parent) | Out-Null
          Copy-Item -Path $debugSource -Destination $debugDestination -Force
          Copy-Item -Path $releaseSource -Destination $releaseDestination -Force

          $debugApk = Get-Item $debugDestination
          $releaseApk = Get-Item $releaseDestination
          Write-Host "Debug APK: $($debugApk.FullName) - $([math]::Round($debugApk.Length / 1MB, 2)) MB"
          Write-Host "Release APK: $($releaseApk.FullName) - $([math]::Round($releaseApk.Length / 1MB, 2)) MB"

      - name: Upload debug APK artifact
        if: env.TASK == 'mobile-build-apk' || env.TASK == 'mobile-auto-deploy'
        uses: actions/upload-artifact@v4
        with:
          name: oziraf-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK artifact
        if: env.TASK == 'mobile-build-apk' || env.TASK == 'mobile-auto-deploy'
        uses: actions/upload-artifact@v4
        with:
          name: oziraf-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
