name: OZIRAF PC Runner

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      task:
        description: Task to run on the OZIRAF Windows PC
        required: true
        default: mobile-analyze
        type: choice
        options:
          - backend-test
          - backend-build
          - mobile-analyze
          - mobile-test
          - mobile-build